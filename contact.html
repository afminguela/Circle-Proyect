<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circle !!</title>
  <link rel="stylesheet" href="./styles/global.css" />
  <link rel="stylesheet" href="./styles/contact.css" />
  <link rel="shortcut icon" type="image/x-icon" href="./media/logos/favicon (1).png" />
</head>

<body>
  <header-component></header-component>
<uppy-button></uppy-button>
  <form id="form-container" action="" method="get" class="formClass">
    <h1>Contact Us</h1>

    <div class="full-name">
      <label for="full Name">Full Name</label><br />
      <input type="text" placeholder="Enter your full name" name="name" id="name" onblur="validateName()" required />
      <p id="name-error" hidden class="errorForm">Name Required, cannot leave this field empty.</p>
    </div>
    <div class="email-phone">
      <div class="email">
        <label for="email">Email</label><br />
        <input type="email" placeholder="Enter your Email" name="email" id="email" onblur="validateEmail()" required />
      </div>
      <div class="phone">
        <label for="phone">Phone</label><br />
        <input type="phone" placeholder="Enter your Phone Number" name="phone" id="phone" onblur="validatePhone()"
          required />
      </div>
    </div>

      <div class="message">
        <label for="message">Message</label><br />
        <textarea cols="33" rows="10" placeholder="Enter your message Number" name="message" id="message" onblur="validateMessage()"
          required > </textarea>
      </div>
<button class="btn " id="btn-submit" type="button" onclick="sendForm()" >Submit</button>
     


</form>

  
  <footer-component></footer-component>
  <script src="./JS/contact.js" type ></script>
   <script src="./JS/modal.js" type ></script>
  <script src="./components/header.js" type="module"></script>
  <script src="./components/uppybtn.js" type="module"></script>
  <script src="./components/footer.js" type="module"></script>
</body>

</html>
